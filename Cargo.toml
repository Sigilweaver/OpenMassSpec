[workspace]
resolver = "2"
members = [
    "crates/openmassspec-io",
    "crates/openmassspec-io-cli",
    "crates/openmassspec-io-py",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.95"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenMassSpec"
homepage = "https://sigilweaver.app/openmassspec/"
documentation = "https://sigilweaver.app/openmassspec/docs/"

[workspace.dependencies]
openmassspec-core = "4.0.0"
openmassspec-arrow = "4.0.0"
opentfraw = "3.0.0"
opentimstdf = "3.0.0"
openwraw = "4.0.0"
openaraw = "1.0.0"
opensxraw = "0.4.0"
openszraw = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Temporary: build against the unreleased openmassspec-core / openmassspec-arrow
# changes (OpenMassSpecCore PRs #30 and #31). Remove this block, and bump the
# dependency versions above, once those are released.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", branch = "fix/arrow-checked-push" }
openmassspec-arrow = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", branch = "fix/arrow-checked-push" }
