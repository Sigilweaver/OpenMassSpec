[workspace]
resolver = "2"
members = [
    "crates/openmassspec-io",
    "crates/openmassspec-io-cli",
    "crates/openmassspec-io-py",
]

[workspace.package]
version = "2.1.1"
edition = "2021"
rust-version = "1.95"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenMassSpec"
homepage = "https://sigilweaver.app/openmassspec/"
documentation = "https://sigilweaver.app/openmassspec/docs/"

[workspace.dependencies]
openmassspec-core = "3.0.0"
openmassspec-arrow = "3.0.0"
opentfraw = "3.1.0"
opentimstdf = "3.0.1"
openwraw = "4.0.2"
openaraw = "1.0.0"
opensxraw = "0.4.0"
openszraw = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
