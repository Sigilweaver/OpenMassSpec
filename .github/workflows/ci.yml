# CI for OpenMassSpec (umbrella).
#
# The workspace pulls openmassspec-core, opentfraw, opentimstdf, openwraw,
# openaraw, and opensxraw from crates.io (registry versions pinned in
# Cargo.toml), so only this repo needs to be checked out. The rust and
# python matrices mirror release.yml/publish.yml's wheel-build matrix
# (Ubuntu, macOS, Windows) per CI_STANDARDS.md - every OS a wheel/binary
# ships for gets exercised here. fmt/clippy are OS-independent and only
# run once, on Ubuntu.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        # windows-latest defaults to pwsh; the steps below (and Swatinem/
        # rust-cache internals) assume POSIX shell syntax. Git-for-Windows
        # ships a real bash, so this works uniformly across all three OSes.
        shell: bash
    steps:
      - name: Checkout OpenMassSpec
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # fmt/clippy results are OS-independent; only run them once to avoid
      # tripling redundant CI time (org standard, see CI_STANDARDS.md).
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # Populates repo-root corpus/ with the eight small vendor fixtures
      # crates/openmassspec-io/tests/vendor2mzml.rs and
      # crates/openmassspec-io-cli/tests/cli_centroid.rs look for, so
      # those tests exercise a real decode path here instead of always
      # skipping - see Sigilweaver/OpenMassSpec#24 (Thermo/Waters/Bruker/
      # Shimadzu) and #25 (Agilent/SCIEX). Combined the fixtures are
      # ~145 MB (dominated by the ~90 MB Bruker bundle), so (matching the
      # existing OS-independent-checks convention above, and precedent in
      # OpenTimsTDF's own CI for the same Bruker fixture) this only runs
      # on the ubuntu-latest leg; macOS/Windows continue to skip these
      # tests as they do today.
      - name: Download corpus fixtures for smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          mkdir -p corpus/thermo corpus/waters corpus/bruker \
            corpus/shimadzu/PXD034978 corpus/shimadzu/MTBLS432 corpus/shimadzu/MSV000084197 \
            corpus/agilent corpus/sciex/PXD022088

          # Thermo (PXD068962, PRIDE, CC0)
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o corpus/thermo/PXD068962_Q_Exactive_UHMR_insource-CID.raw \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/12/PXD068962/insource-CID.raw"

          # Waters (PXD058812, PRIDE, CC0) - zipped bundle directory
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" -o waters.raw.zip \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD058812/molecular_mass_P15_01.raw.zip"
          unzip -q -d corpus/waters waters.raw.zip
          rm waters.raw.zip
          test -f corpus/waters/molecular_mass_P15_01.raw/_HEADER.TXT

          # Bruker (PXD036417, PRIDE, CC0) - zipped bundle directory, ~90 MB
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" -o bruker.d.zip \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/11/PXD036417/NQO1-F107C_coi-N2-P_200-0C_3996.d.zip"
          unzip -q -d corpus/bruker bruker.d.zip
          rm bruker.d.zip
          test -f corpus/bruker/NQO1-F107C_coi-N2-P_200-0C_3996.d/analysis.tdf
          test -f corpus/bruker/NQO1-F107C_coi-N2-P_200-0C_3996.d/analysis.tdf_bin

          # Shimadzu QGD (PXD034978, PRIDE, CC0)
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o corpus/shimadzu/PXD034978/49_27a__8122021_11.qgd \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/08/PXD034978/49_27a__8122021_11.qgd"

          # Shimadzu LCD, IT-TOF variant (MTBLS432, MetaboLights/EBI)
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o "corpus/shimadzu/MTBLS432/6-wk_HZ_CC_male_12_65__30min_pos-neg_43.lcd" \
            "https://ftp.ebi.ac.uk/pub/databases/metabolights/studies/public/MTBLS432/FILES/6-wk_HZ_CC_male_12_65__30min_pos-neg_43.lcd"

          # Shimadzu LCD, QTOF variant (MSV000084197, MassIVE, CC0) - via
          # the HTTPS download endpoint; the FTP endpoint requires FTPS
          # and isn't reliably reachable with plain curl in CI.
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o corpus/shimadzu/MSV000084197/20190607_NM16.lcd \
            "https://massive.ucsd.edu/ProteoSAFe/DownloadResultFile?file=f.MSV000084197%2Fraw%2F20190607_NM16.lcd"

          # Agilent QTOF (PXD030293, PRIDE, CC0) - zipped bundle directory,
          # ~960 KB zipped; same fixture wired into OpenARaw's own CI, see
          # Sigilweaver/OpenARaw#28.
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" -o agilent.d.zip \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/07/PXD030293/180814-Sample19.d.zip"
          unzip -q -d corpus/agilent agilent.d.zip
          rm agilent.d.zip
          test -d corpus/agilent/180814-Sample19.d

          # SCIEX (PXD022088, PRIDE, CC0) - .wiff + .wiff.scan pair, ~2.5 MB
          # total; same fixture wired into OpenSXRaw's own CI, see
          # Sigilweaver/OpenSXRaw#33.
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o corpus/sciex/PXD022088/Rcor2KOESC1.wiff \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff"
          curl -sSL --user-agent "OpenMassSpec-CI/1.0" \
            -o corpus/sciex/PXD022088/Rcor2KOESC1.wiff.scan \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/12/PXD022088/Rcor2KOESC1.wiff.scan"

          du -sh corpus

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: vendor2mzml validate against shared corpus (best-effort)
        if: matrix.os == 'ubuntu-latest'
        env:
          OPENMASSSPEC_THERMO_RAW: ${{ secrets.OPENMASSSPEC_THERMO_RAW }}
          OPENMASSSPEC_BRUKER_D: ${{ secrets.OPENMASSSPEC_BRUKER_D }}
          OPENMASSSPEC_WATERS_RAW: ${{ secrets.OPENMASSSPEC_WATERS_RAW }}
        run: |
          set -e
          for VAR in OPENMASSSPEC_THERMO_RAW OPENMASSSPEC_BRUKER_D OPENMASSSPEC_WATERS_RAW; do
            VAL="${!VAR}"
            if [ -z "$VAL" ]; then
              echo "skip $VAR (unset)"
              continue
            fi
            if [ ! -e "$VAL" ]; then
              echo "skip $VAR=$VAL (not present in runner)"
              continue
            fi
            echo "validate $VAR -> $VAL"
            cargo run -p openmassspec-io-cli --release --quiet -- validate --json "$VAL"
          done

  msrv:
    name: MSRV check (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-features

  python:
    name: Python smoke (${{ matrix.os }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python: ["3.9", "3.12"]
    defaults:
      run:
        # windows-latest defaults to pwsh; the steps below rely on POSIX
        # shell syntax. Git-for-Windows ships a real bash, so this works
        # uniformly across all three OSes.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Create venv
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            # Windows venvs put scripts (incl. python.exe) in Scripts/, not bin/.
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + pytest
        run: pip install 'maturin>=1.5,<2' pytest pyarrow numpy
      - name: Build and install openmassspec-io
        working-directory: crates/openmassspec-io-py
        # maturin supplies the pyo3 extension-module linker flags for us
        # (incl. the macOS -undefined dynamic_lookup / Windows import-lib
        # handling); no bare `cargo build`/`cargo test` runs in this job.
        run: maturin develop --release --features pyo3/extension-module
      - name: Install openmassspec metapackage
        run: pip install ./python
      - name: Import smoke test
        run: python -c "import openmassspec_io; print(openmassspec_io.__version__ if hasattr(openmassspec_io, '__version__') else 'ok')"
      - name: Metapackage import smoke
        run: python -c "import openmassspec; print(openmassspec.__version__); assert callable(openmassspec.to_mzml)"
      - name: Metapackage tests
        run: pytest python/tests -v

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: docs
        run: bun run build:cloudflare
      # Cloudflare deployment is handled by the Cloudflare GitHub App
      # via push events. No wrangler deploy step is needed here.
